name: Refresh NHL data

on:
  schedule:
    # Four times a day (UTC): GitHub often starts scheduled runs hours late or skips
    # them, so one daily run could leave stats a full day behind. 08:17 UTC (~3am
    # Eastern) picks up the previous night's games; the others are catch-ups.
    # Runs on the default branch.
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refresh-data.ts'
      - 'src/data/**'
      - '.github/workflows/refresh-data.yml'

permissions:
  contents: write

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch, reconcile and validate
        run: npm run data:refresh
      - name: Upload raw responses and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-raw
          path: data-raw/
          if-no-files-found: ignore
      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh NHL schedule, player directory and skater stats"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Insights data (testing, V1): keeps a rolling window of game nights in the private repository
  # jmaser54/playoff-planner-data and writes the derived public/data/insights-inputs.json. Only this
  # job gets DATA_REPO_TOKEN (data-refresh environment, main only), and only on scheduled or manual
  # runs; no pull-request workflow uses it. It uploads no artifacts and logs only counts and dates.
  # A failure here never changes the refresh job's data.
  insights:
    needs: refresh
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: data-refresh
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check for the data repository token
        id: token
        env:
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -n "$DATA_TOKEN" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; echo "::warning::DATA_REPO_TOKEN unavailable; insights skipped"; fi
      - name: Check out the private data repository
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: jmaser54/playoff-planner-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: .insights-state
      - name: Refresh Insights inputs
        if: steps.token.outputs.available == 'true'
        env:
          INSIGHTS_STATE_DIR: .insights-state/testing
        run: npm run data:insights
      - name: Save game-night history to the private repository
        if: steps.token.outputs.available == 'true'
        working-directory: .insights-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if [ -d testing ]; then git add -A testing; fi
          if git diff --cached --quiet; then
            echo "No history changes."
          else
            git commit -q -m "history: insights game-night window (testing)"
            git push -q origin HEAD:main
            echo "History saved."
          fi
      - name: Commit public Insights inputs
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/data/insights-inputs.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No insights changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh insights inputs"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so redeploy
  # the site here whenever the snapshot changed. The deploy workflow itself
  # skips non-default branches and repositories without Pages enabled.
  deploy:
    needs: [refresh, insights]
    if: always() && (needs.refresh.outputs.changed == 'true' || needs.insights.outputs.changed == 'true')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
